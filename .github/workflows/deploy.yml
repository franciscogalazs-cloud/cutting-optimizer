name: Deploy Vite to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - name: Enable corepack (safety)
        run: corepack enable
      - name: Verify pnpm
        run: |
          pnpm --version
          which pnpm
      - name: Ensure pnpm in PATH (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found, installing globally via npm..."
            npm i -g pnpm@10.4.1
            pnpm --version
            which pnpm
          fi
      - name: Set CI env
        run: echo "CI=true" >> $GITHUB_ENV
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: pnpm build
      - name: Copy 404 for SPA fallback
        run: |
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
